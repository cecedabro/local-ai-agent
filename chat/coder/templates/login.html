{% extends "base.html" %}
{% block title %}Sign in · Dewdrop{% endblock %}
{% block body %}
<body class="login">
<div class="card">
  <span class="orb" data-phase="idle"><i></i><i></i><i></i><i></i></span>
  <h1>Dewdrop</h1>
  <p class="muted small">A local AI, running on a home GPU</p>
  <form id="login-form" autocomplete="on">
    <input name="username" placeholder="Username" autocomplete="username" required>
    <span class="pw"><input name="password" type="password" placeholder="Password" autocomplete="current-password" required><button type="button" class="pw-eye" aria-label="Show password" aria-pressed="false" title="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="open" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle class="open" cx="12" cy="12" r="3"/><path class="shut" d="M3 3l18 18M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></span>
    <button class="primary">Sign in</button>
    <button type="button" id="passkey-signin" class="passkey-btn" hidden>Sign in with a passkey</button>
    <p id="login-error" class="small bad" role="alert"></p>
  </form>
  <p class="muted small">Invite only. Got an invite link? Open it to set your password.</p>
</div>
<script src="/static/js/login.js"></script>
<script src="/static/js/webauthn.js"></script>
<script type="module" src="/static/js/password.js"></script>
</body>
{% endblock %}
