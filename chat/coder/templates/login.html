{% extends "base.html" %}
{% block title %}Sign in · Dewdrop{% endblock %}
{% block body %}
<body class="login">
<div class="card">
  <span class="orb" data-phase="idle"><i></i><i></i><i></i><i></i></span>
  <h1>Dewdrop</h1>
  <p class="muted small">A local AI, running on a home GPU</p>
  <form id="login-form" autocomplete="on">
    <input name="username" placeholder="Username" autocomplete="username" required>
    <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="primary">Sign in</button>
    <p id="login-error" class="small bad" role="alert"></p>
  </form>
  <p class="muted small">Invite only. Got an invite link? Open it to set your password.</p>
</div>
<script src="/static/js/login.js"></script>
</body>
{% endblock %}
