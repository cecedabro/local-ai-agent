apiVersion: apps/v1
kind: Deployment
metadata:
  name: waker
  namespace: ai-waker
  labels: {app: waker}
spec:
  replicas: 1
  strategy: {type: Recreate}   # hostPort-style binding: never two at once
  selector:
    matchLabels: {app: waker}
  template:
    metadata:
      labels: {app: waker}
    spec:
      hostNetwork: true          # pod networks don't carry LAN broadcasts
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: REPLACE_ME   # a wired node on the same LAN as the PC
      containers:
        - name: waker
          image: python:3.13-alpine
          command: ["python", "-u", "/app/waker.py"]
          env:
            - {name: PORT, value: "9009"}
            - name: PC_MAC
              valueFrom: {secretKeyRef: {name: waker, key: PC_MAC}}
            - name: WAKER_TOKEN
              valueFrom: {secretKeyRef: {name: waker, key: WAKER_TOKEN}}
          ports:
            - {name: http, containerPort: 9009}
          readinessProbe:
            httpGet: {path: /healthz, port: 9009}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
      volumes:
        - name: app
          configMap: {name: waker-app}
---
apiVersion: v1
kind: Service
metadata:
  name: waker
  namespace: ai-waker
spec:
  selector: {app: waker}
  ports:
    - {name: http, port: 80, targetPort: 9009}
