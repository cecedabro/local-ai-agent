# Example only. Create the real one SOPS-encrypted in the homelab repo.
apiVersion: v1
kind: Secret
metadata:
  name: devbox
  namespace: ai-agent
stringData:
  LLAMA_API_KEY: "contents of /etc/llama/api-key on the PC"
  GITHUB_TOKEN: "fine-grained PAT: one repo, contents + pull requests read/write"
  WAKER_TOKEN: "same value as in the waker secret"
  NTFY_TOKEN: "optional"
  TS_AUTHKEY: "tskey-auth-... (reusable: no, tagged: tag:devbox)"
  PC_SSH_KEY: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    private half of the key whose .pub went to pc/power/setup-wsl.sh
    -----END OPENSSH PRIVATE KEY-----
