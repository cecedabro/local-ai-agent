name: devbox-image
on:
  push:
    branches: [main]
    paths: [devbox/**, harness/**, .github/workflows/devbox-image.yml]
  schedule:
    - cron: "17 4 * * 1"   # weekly rebuild picks up agent and tool updates
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: pip install pyyaml
      - run: make lint test
  # Only push an image when lint + self-test pass. The cluster pins the sha tag (homelab repo,
  # apps/ai-agent/devbox.yaml), so a new build never restarts a running agent by itself.
  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: devbox/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/local-ai-agent-devbox:latest
            ghcr.io/${{ github.repository_owner }}/local-ai-agent-devbox:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
